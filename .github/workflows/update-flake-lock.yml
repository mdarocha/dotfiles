name: Update flake.lock

on:
  schedule:
    - cron: '0 21 * * 5' # Friday at 21:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    name: Update lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Nix
        uses: mdarocha/nix-magic-setup@fbeadb287d13c1f3a3c2ccd9b7fb0f6201300997 # v1.3.0

      - name: Update flake.lock
        id: update-flake-lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: automated

      - uses: mdarocha/comment-flake-lock-changelog@709edb53d1a4937e9792876a036671f3316f1186 # v1.0.2
        if: ${{ steps.update-flake-lock.outputs.pull-request-number != 0 }}
        with:
          pull-request-number: ${{ steps.update-flake-lock.outputs.pull-request-number }}
