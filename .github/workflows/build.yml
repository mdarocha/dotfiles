name: 📦️ Build configurations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@0af51e37404acfb298f7e2eec77470be27eb57c5 # v10

      - name: Setup Cachix
        uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
        with:
          name: mdarocha-dotfiles
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # only push from the main branch
          skipPush: ${{ github.event_name == 'pull_request' }}

      - run: nix flake check -L

      - name: Report configuration sizes
        run: nix run .#report-sizes >> $GITHUB_STEP_SUMMARY
