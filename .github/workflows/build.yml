name: 📦️ Build configurations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@078f5f7f47ee188aa6cb472527ca5984e195222d # v9

      - name: Setup Cachix
        uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        with:
          name: mdarocha-dotfiles
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # only push from the main branch
          skipPush: ${{ github.event_name == 'pull_request' }}

      - run: nix flake check -L

      - name: Report configuration sizes
        run: nix run .#report-sizes >> $GITHUB_STEP_SUMMARY
